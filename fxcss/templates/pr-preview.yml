name: PR preview

# Renders the theme's browser chrome before and after a pull request so the
# visual effect of a CSS change can be reviewed without installing anything.
#
# The rendering itself is done by fxcss, installed from PyPI at a pinned
# release: https://github.com/AdamXweb/fxcss
# Pinned rather than floating so a change over there can never alter what
# this repo's CI does without a commit here.
#
# This workflow checks out pull request code but deliberately has NO write
# permissions and NO access to secrets; it only produces an artifact. The
# companion pr-preview-publish.yml picks that artifact up and posts the comment
# with the permissions this one is not allowed to have. Because the renderer
# now comes from a pinned release rather than from the pull request, a pull
# request cannot change how it behaves either.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
__FXCSS_THEME_PATHS__
      - '.github/workflows/pr-preview.yml'

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FXCSS_VERSION: __FXCSS_VERSION__
  # What the preview captures and shows. Edit these here, or set them with
  # `fxcss init --variants ... --views ... --min-changed-percent ... --force`.
  #
  # Optional stylesheets to capture: 'all', '' for none, or names such as
  # 'compact,tabs-swapclose' ('a+b' captures two together). Named sheets must
  # exist in both the base branch and the pull request.
  FXCSS_VARIANTS: '__FXCSS_PREVIEW_VARIANTS__'
  # Views to compare and show, as comma-separated patterns with * and ?
  # wildcards, e.g. 'light-*,extra-07-many-tabs,variant-*'. '' shows every
  # view. Every view is still captured; a pattern that matches none fails.
  FXCSS_VIEWS: '__FXCSS_PREVIEW_VIEWS__'
  # A view where less than this percent of pixels changed is listed in the
  # comment with its percentage but not pictured. '0' pictures every change.
  FXCSS_MIN_CHANGED_PERCENT: '__FXCSS_PREVIEW_MIN_PERCENT__'

jobs:
  render:
    name: Render (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux

    steps:
      - name: Check out base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out pull request revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install fxcss
        run: >-
          python -m pip install --disable-pip-version-check
          "fxcss[images]==${{ env.FXCSS_VERSION }}"

      - name: Install Firefox (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -sSL -o firefox.dmg \
            "https://download.mozilla.org/?product=firefox-latest-ssl&os=osx&lang=en-US"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/ffci firefox.dmg
          cp -R /Volumes/ffci/Firefox.app "$RUNNER_TEMP/Firefox.app"
          hdiutil detach /Volumes/ffci -quiet
          echo "FIREFOX_BIN=$RUNNER_TEMP/Firefox.app/Contents/MacOS/firefox" >> "$GITHUB_ENV"

      - name: Install Firefox (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils libdbus-glib-1-2 >/dev/null
          curl -sSL -o firefox.tar "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
          mkdir -p "$RUNNER_TEMP/ff"
          tar -xf firefox.tar -C "$RUNNER_TEMP/ff"
          echo "FIREFOX_BIN=$RUNNER_TEMP/ff/firefox/firefox" >> "$GITHUB_ENV"

      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          command -v xdpyinfo
          Xvfb :99 -screen 0 1600x1200x24 -nolisten tcp >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 20); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/xvfb.log"
          xdpyinfo -display :99
          echo '::error::Xvfb did not become ready'
          exit 1

      - name: Install Firefox (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'firefox-setup.exe'
          Invoke-WebRequest -Uri 'https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $bin = 'C:\Program Files\Mozilla Firefox\firefox.exe'
          if (-not (Test-Path $bin)) { throw "Firefox not found at $bin after install" }
          "FIREFOX_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Environment
        run: fxcss doctor --theme head

      # The base branch renders identically every time -- that determinism is
      # the contract fxcss's own CI asserts -- so after the first push to a
      # pull request there is no reason to render it again. The key names
      # everything that could change the pixels: the base commit, the runner
      # image, the Firefox that happened to be current, the fxcss release and
      # this workflow file. A miss on any of them re-renders; there is no
      # restore-keys fallback, because a near-match is a different render.
      #
      # GitHub scopes caches to the branch that made them, so this helps the
      # second and later pushes of a pull request, not its first.
      - name: Base render cache key
        id: basekey
        shell: bash
        run: |
          firefox=$(python - <<'EOF'
          import configparser, os, pathlib
          binary = pathlib.Path(os.environ["FIREFOX_BIN"])
          for ini in (binary.parent / "application.ini",
                      binary.parent.parent / "Resources" / "application.ini"):
              if ini.is_file():
                  cfg = configparser.ConfigParser(); cfg.read(ini, encoding="utf-8")
                  print(cfg.get("App", "Version", fallback="unknown")); break
          else:
              print("unknown")
          EOF
          )
          echo "firefox=$firefox" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "base render key: firefox=$firefox image=${ImageVersion:-unknown}"

      - name: Restore base render
        id: basecache
        uses: actions/cache/restore@v5
        with:
          path: shots/base
          key: >-
            base-render-${{ matrix.label }}-${{ github.event.pull_request.base.sha }}-ff${{ steps.basekey.outputs.firefox }}-img${{ steps.basekey.outputs.image }}-fxcss${{ env.FXCSS_VERSION }}-${{ hashFiles('head/.github/workflows/pr-preview.yml') }}

      # bash on every runner, Windows included, so the settings above reach
      # fxcss as quoted shell variables rather than as text pasted into a script.
      - name: Render base revision
        if: steps.basecache.outputs.cache-hit != 'true'
        shell: bash
        run: fxcss shot --theme base --out shots/base --variants="$FXCSS_VARIANTS"

      # Saved the moment the base render succeeds rather than when the job
      # ends: a push that supersedes this run cancels it, and the base is
      # usually done by then -- which is exactly the run the next push wants.
      - name: Save base render
        if: steps.basecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: shots/base
          key: ${{ steps.basecache.outputs.cache-primary-key }}

      - name: Render pull request revision
        shell: bash
        run: fxcss shot --theme head --out shots/head --variants="$FXCSS_VARIANTS"

      - name: Compare
        shell: bash
        run: >-
          fxcss compare --base shots/base --head shots/head
          --out out/${{ matrix.label }} --platform ${{ matrix.label }}
          --views="$FXCSS_VIEWS" --min-changed-percent="$FXCSS_MIN_CHANGED_PERCENT"

      - name: Record pull request number
        shell: bash
        run: |
          echo "${{ github.event.pull_request.number }}" > out/pr-number.txt
          echo "${{ github.event.pull_request.head.sha }}" > out/head-sha.txt

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: preview-${{ matrix.label }}
          path: out/
          retention-days: 14
          if-no-files-found: error
