[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fxcss"
description = "Live-reload, inspect and screenshot-test Firefox userChrome.css themes"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AdamXweb" }]
keywords = ["firefox", "userchrome", "css", "theme", "firefoxcss", "testing"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

# Pillow does the image work: catalogue, compare, check, tweaks and
# upgrade --compare. Everything else still imports it lazily, so a checkout
# run without installing, or a --no-deps install, keeps working.
dependencies = ["pillow>=10.1"]

[project.optional-dependencies]
# Empty on purpose: Pillow used to live here, and `fxcss[images]` must keep
# installing for existing commands, scripts and generated workflows.
images = []

[project.scripts]
fxcss = "fxcss.cli:main"

[project.urls]
Homepage = "https://github.com/AdamXweb/fxcss"
Documentation = "https://github.com/AdamXweb/fxcss#readme"
Changelog = "https://github.com/AdamXweb/fxcss/releases"
Issues = "https://github.com/AdamXweb/fxcss/issues"

[tool.setuptools]
packages = ["fxcss"]

[tool.setuptools.package-data]
fxcss = ["templates/*.yml", "templates/starter/chrome/*.css", "templates/starter/custom/*.css"]

[tool.setuptools.dynamic]
version = {attr = "fxcss.__version__"}
