# Website CI for fxcss.com. The site lives on this `website` branch; fxcss
# itself, and the README its documentation is generated from, live on `main`.
# Runs on GitHub-hosted runners: the repository is public, and the self-hosted
# fleet is kept to private repositories.

name: Website

on:
  pull_request:
    branches: [website]
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ensure ShellCheck is available
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - run: npm ci
      - run: npm run content
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: bash -n public/install.sh && shellcheck public/install.sh
      - run: npm run test:installer
      - run: npm run check:audit
      - run: npm run build
      - name: Dry-run the Cloudflare Worker deploy
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run deploy -- --dry-run
      - name: Verify the production server
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: scripts/check-built-site.sh

  # The documentation is a recorded copy of main's README (content/source).
  # Refresh docs normally keeps it current, but a refresh can fail or wait for
  # PyPI, so say when that copy is behind.
  # A warning, not a failure: README edits on main should not block site work.
  docs-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main-checkout
          sparse-checkout: |
            README.md
            fxcss/__init__.py
          sparse-checkout-cone-mode: false
      - name: Compare the recorded README and version with main
        run: |
          stale=""
          cmp -s main-checkout/README.md content/source/README.md || stale="$stale README.md"
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' main-checkout/fxcss/__init__.py)
          [ "$version" = "$(cat content/source/version.txt)" ] || stale="$stale version ($version on main)"
          if [ -n "$stale" ]; then
            echo "::warning title=Documentation is behind main::Changed on main:$stale. Refresh with 'just content <checkout of main>' and commit content/."
          else
            echo "Documentation matches main."
          fi
