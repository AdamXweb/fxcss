# Regenerates the documentation from main and pushes it straight to this
# branch, which Workers Builds then deploys. The homepage's release pill reads
# the same recorded version, so it moves with the docs.
#
# main's "Website docs" workflow starts this after a release reaches PyPI and
# after each README change on main. Run it by hand with:
#   gh workflow run refresh-docs.yml --ref website
#
# Two rules:
# - It never publishes a version PyPI doesn't serve yet. main's version moves
#   when the release prep merges, before the package is uploaded, and the site
#   must not advertise an install that fails. Such a refresh is skipped, and
#   the Publish run starts another one once the release is installable.
# - It runs the checks a documentation change can break before pushing.
#   A push made with GITHUB_TOKEN starts no other workflow, so Website CI never
#   sees this commit. Lint, the installer tests, the dependency audit and the
#   deploy dry run cover files this job never changes, so they stay with
#   Website CI.

name: Refresh docs

on:
  workflow_dispatch:
  # Also runs when this file changes. That registers the workflow, which
  # main's dispatch needs, and proves each edit end to end.
  push:
    branches: [website]
    paths: ['.github/workflows/refresh-docs.yml']

permissions:
  contents: read

concurrency:
  group: refresh-docs
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'AdamXweb/fxcss' && github.ref == 'refs/heads/website'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out main's README, version and icon
        uses: actions/checkout@v7
        with:
          ref: main
          path: main-checkout
          sparse-checkout: |
            README.md
            fxcss/__init__.py
            docs/icon.png
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # npm run content writes content/ and copies main's icon to
      # public/assets/icon.png; anything else changing is a bug, not a refresh.
      - name: Regenerate the documentation
        id: content
        env:
          FXCSS_SOURCE: main-checkout
        run: |
          set -euo pipefail
          npm run content
          version=$(cat content/source/version.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "main=$(git -C main-checkout rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          outside=$(git diff --name-only -- . ':!content' ':!public/assets/icon.png')
          if [ -n "$outside" ]; then
            echo "::error::npm run content changed files it should not: $outside"
            exit 1
          fi
          if git diff --quiet -- content public/assets/icon.png; then
            echo "::notice title=Documentation already current::It matches main's README and fxcss $version."
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/fxcss/$version/json")
          if [ "$code" != 200 ]; then
            echo "::notice title=Waiting for PyPI::main is at fxcss $version, which PyPI does not serve yet (HTTP $code). Its Publish run refreshes the docs once the release is installable."
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet -- content/source/version.txt; then
            echo "message=Refresh the documentation from main" >> "$GITHUB_OUTPUT"
          else
            echo "message=Update the documentation to fxcss $version" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=yes" >> "$GITHUB_OUTPUT"

      - if: steps.content.outputs.publish == 'yes'
        run: npm run typecheck
      - if: steps.content.outputs.publish == 'yes'
        run: npm test
      - if: steps.content.outputs.publish == 'yes'
        run: npm run build
      - name: Verify the production server
        if: steps.content.outputs.publish == 'yes'
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: scripts/check-built-site.sh

      - name: Push to website
        if: steps.content.outputs.publish == 'yes'
        env:
          MESSAGE: ${{ steps.content.outputs.message }}
          MAIN: ${{ steps.content.outputs.main }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content public/assets/icon.png
          git commit -q -m "$MESSAGE" -m "Generated by the Refresh docs workflow from main at $MAIN."
          git push origin HEAD:website
          echo "::notice title=Documentation published::$MESSAGE ($(git rev-parse --short HEAD))."
