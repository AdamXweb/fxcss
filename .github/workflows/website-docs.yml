name: Website docs

# fxcss.com's documentation is generated from this README, and its homepage
# shows the released version. The site lives on the `website` branch, whose
# Refresh docs workflow regenerates it from main, checks it and publishes it.
# This starts that workflow whenever README.md changes on main.
#
# After a release, Publish starts it instead, once PyPI serves the new version
# and the README's pins have moved to it. That pin update is pushed with
# GITHUB_TOKEN, which starts no workflow, so it doesn't run this one too.
# The refresh skips a version PyPI doesn't serve yet, so README changes merged
# between a release's prep and its upload don't advertise it early.

on:
  push:
    branches: [main]
    paths: [README.md]

permissions:
  contents: read

jobs:
  refresh:
    if: github.repository == 'AdamXweb/fxcss'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start Refresh docs on the website branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-docs.yml --repo "$GITHUB_REPOSITORY" --ref website
