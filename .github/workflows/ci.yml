name: CI

# Runs the unit tests on every supported Python and on macOS, Windows and
# Linux, then smoke-tests the toolkit against the starter and representative
# layouts on all three. The determinism check is the important one: rendering
# the same unchanged theme twice must produce identical screenshots, or
# `compare` would report noise as a change on every pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compatibility:
        description: 'Also run Stable, ESR, Beta and Nightly compatibility checks'
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  changes:
    name: Decide CI scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Identify README-only changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/ci-changed-files"
          full=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if git diff --name-only -z "$PR_BASE...$PR_HEAD" > "$changed"; then
              full=false
            fi
          elif [[ "$EVENT_NAME" == push && "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            if git diff --name-only -z "$PUSH_BASE" "$PUSH_HEAD" > "$changed"; then
              full=false
            fi
          fi
          if [[ "$full" == false ]]; then
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md) ;;
                *) full=true; break ;;
              esac
            done < "$changed"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Run full CI: $full"

  units:
    name: Unit tests (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Linux covers every supported Python: 3.9 is the floor pyproject
        # claims (the import test makes that job prove every module at least
        # loads there) and 3.14 the newest release. macOS and Windows run the
        # whole suite once each, on the Python the Firefox jobs use, so path,
        # line-ending and process differences -- profile installation and
        # rollback above all -- are caught here and not by a theme author.
        include:
          # Python 3.9 is unavailable on Ubuntu 26.04; preserve the supported floor.
          - { os: ubuntu-24.04, python: '3.9', label: py3.9 }
          - { os: ubuntu-latest, python: '3.12', label: py3.12 }
          # The oldest Pillow the images extra accepts, so an image API newer
          # than that floor fails here rather than for a theme author.
          - { os: ubuntu-latest, python: '3.12', label: 'py3.12, Pillow 10.1.0', pillow: '10.1.0' }
          - { os: ubuntu-latest, python: '3.14', label: py3.14 }
          - { os: macos-latest, python: '3.12', label: 'macOS, py3.12' }
          - { os: windows-latest, python: '3.12', label: 'Windows, py3.12' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check ".[images]"
      - name: Install the minimum Pillow
        if: matrix.pillow
        env:
          PILLOW: ${{ matrix.pillow }}
        run: |
          python -m pip install --disable-pip-version-check "pillow==$PILLOW"
          python -c "import os, PIL; assert PIL.__version__ == os.environ['PILLOW'], PIL.__version__"
      - run: python -m unittest discover -s tests -v

  build-package:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-dist
          path: dist/
          if-no-files-found: error

  package-checks:
    needs: build-package
    uses: ./.github/workflows/package-check.yml
    with:
      artifact-name: candidate-dist

  compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.compatibility
    uses: ./.github/workflows/firefox-compatibility.yml

  smoke:
    name: ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            product: firefox-latest-ssl
          - os: windows-latest
            label: Windows
            product: firefox-latest-ssl
          - os: ubuntu-latest
            label: Linux
            product: firefox-latest-ssl
          - os: ubuntu-latest
            label: Linux-ESR
            product: firefox-esr-latest-ssl

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install fxcss
        run: python -m pip install --disable-pip-version-check ".[images]"

      - name: Install Firefox (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -sSL -o firefox.dmg \
            "https://download.mozilla.org/?product=${{ matrix.product }}&os=osx&lang=en-US"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/ffci firefox.dmg
          cp -R /Volumes/ffci/Firefox.app "$RUNNER_TEMP/Firefox.app"
          hdiutil detach /Volumes/ffci -quiet
          echo "FIREFOX_BIN=$RUNNER_TEMP/Firefox.app/Contents/MacOS/firefox" >> "$GITHUB_ENV"

      - name: Install Firefox (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # libdbus-glib is the one Firefox tarballs reliably miss on Ubuntu.
          # xvfb because Firefox draws no browser chrome headless -- a headless
          # screenshot is an empty window, so a real display is required.
          sudo apt-get install -y -qq xvfb x11-utils libdbus-glib-1-2 >/dev/null
          curl -sSL -o firefox.tar "https://download.mozilla.org/?product=${{ matrix.product }}&os=linux64&lang=en-US"
          mkdir -p "$RUNNER_TEMP/ff"
          tar -xf firefox.tar -C "$RUNNER_TEMP/ff"
          echo "FIREFOX_BIN=$RUNNER_TEMP/ff/firefox/firefox" >> "$GITHUB_ENV"

      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Comfortably larger than the 1280x480 capture window, so nothing is
          # clipped and no scrollbar appears from the screen being too small.
          command -v xdpyinfo
          Xvfb :99 -screen 0 1600x1200x24 -nolisten tcp >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 20); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/xvfb.log"
          xdpyinfo -display :99
          echo '::error::Xvfb did not become ready'
          exit 1

      - name: Install Firefox (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'firefox-setup.exe'
          Invoke-WebRequest -Uri 'https://download.mozilla.org/?product=${{ matrix.product }}&os=win64&lang=en-US' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $bin = 'C:\Program Files\Mozilla Firefox\firefox.exe'
          if (-not (Test-Path $bin)) { throw "Firefox not found at $bin" }
          "FIREFOX_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: doctor
        run: fxcss doctor --theme fxcss/templates/starter

      - name: Representative theme layouts
        run: python -m tests.smoke_themes

      - name: Unusable initial browser recovery
        run: python -m tests.smoke_startup

      - name: Audio indicators render without a sound device
        run: python -m tests.smoke_audio

      - name: Optional stylesheets apply in install and try
        run: python -m tests.smoke_variants

      # Three captures, not two, and every pair compared: the flakes this has
      # caught were intermittent, and a run that differs from both others is
      # told apart from a check-vs-shot difference that repeats.
      - name: Project check and three captures
        run: python -m tests.smoke_capture_states capture

      - name: Determinism — the same theme must render identically
        run: python -m tests.smoke_capture_states determinism --platform ${{ matrix.label }}

      - name: Detects a real change
        run: python -m tests.smoke_capture_states real-change --platform ${{ matrix.label }}

      # End to end and Linux-only (the code is platform-independent Python;
      # once is proof, three times is minutes): install the starter theme into
      # a fake profile, change the source, and let `upgrade --compare` render
      # installed vs new and diff them. This is the one upgrade path that
      # needs a live Firefox, so unit tests cannot carry it.
      - name: upgrade --compare renders installed vs new
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ffprofiles"
          mkdir -p "$root/Profiles/ci.default-release"
          touch "$root/Profiles/ci.default-release/prefs.js"
          printf '[Profile0]\nName=ci\nIsRelative=1\nPath=Profiles/ci.default-release\n' \
            > "$root/profiles.ini"
          cp -r fxcss/templates/starter "$RUNNER_TEMP/upgrade-src"
          FXCSS_PROFILE_ROOTS="$root" fxcss install "$RUNNER_TEMP/upgrade-src" \
            --profile ci --with '' --yes
          printf '\n#nav-bar { background-color: #a01414 !important; }\n' \
            >> "$RUNNER_TEMP/upgrade-src/chrome/userChrome.css"
          FXCSS_PROFILE_ROOTS="$root" fxcss upgrade --profile ci --compare --yes
          python - <<'PY'
          import glob, json, pathlib, sys
          dirs = sorted(glob.glob("/tmp/fxcss-upgrade-compare-*"))
          if not dirs:
              sys.exit("no fxcss-upgrade-compare output directory was written")
          summary = json.loads(
              pathlib.Path(dirs[-1], "diff", "summary.json").read_text())
          changed = [v["view"] for v in summary["changed_views"]]
          if not changed:
              sys.exit("the nav-bar recolour was not seen by upgrade --compare")
          print(f"upgrade --compare saw the change in: {', '.join(changed)}")
          PY

      # Each view targeted by a state-only rule must change; falling back to
      # an ordinary window must not pass.
      - name: State and surface views render their own states
        run: python -m tests.smoke_capture_states states --platform ${{ matrix.label }}

      - name: catalogue
        run: fxcss catalogue --theme fxcss/templates/starter --out out/catalogue --self-contained

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fxcss-${{ matrix.label }}
          path: out/
          retention-days: 7

      # The original captures, unscaled, so a single changed pixel can be
      # inspected; out/ holds only normalised copies of the head side.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fxcss-${{ matrix.label }}-shots
          path: shots/
          retention-days: 7
