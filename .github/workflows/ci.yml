name: CI

# Smoke-tests the toolkit against fxcss/templates/starter on the two platforms
# most themes target. The determinism check is the important one: rendering the
# same unchanged theme twice must produce identical screenshots, or `compare`
# would report noise as a change on every pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  units:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor pyproject claims; the import test makes this job
        # prove every module at least loads there.
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check ".[images]"
      - run: python -m unittest discover -s tests -v

  smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install fxcss
        run: python -m pip install --disable-pip-version-check ".[images]"

      - name: Install Firefox (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -sSL -o firefox.dmg \
            "https://download.mozilla.org/?product=firefox-latest-ssl&os=osx&lang=en-US"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/ffci firefox.dmg
          cp -R /Volumes/ffci/Firefox.app "$RUNNER_TEMP/Firefox.app"
          hdiutil detach /Volumes/ffci -quiet
          echo "FIREFOX_BIN=$RUNNER_TEMP/Firefox.app/Contents/MacOS/firefox" >> "$GITHUB_ENV"

      - name: Install Firefox (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # libdbus-glib is the one Firefox tarballs reliably miss on Ubuntu.
          # xvfb because Firefox draws no browser chrome headless -- a headless
          # screenshot is an empty window, so a real display is required.
          sudo apt-get install -y -qq xvfb libdbus-glib-1-2 >/dev/null
          curl -sSL -o firefox.tar "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
          mkdir -p "$RUNNER_TEMP/ff"
          tar -xf firefox.tar -C "$RUNNER_TEMP/ff"
          echo "FIREFOX_BIN=$RUNNER_TEMP/ff/firefox/firefox" >> "$GITHUB_ENV"

      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Comfortably larger than the 1280x480 capture window, so nothing is
          # clipped and no scrollbar appears from the screen being too small.
          Xvfb :99 -screen 0 1600x1200x24 -nolisten tcp >/dev/null 2>&1 &
          for _ in $(seq 1 20); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Install Firefox (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'firefox-setup.exe'
          Invoke-WebRequest -Uri 'https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $bin = 'C:\Program Files\Mozilla Firefox\firefox.exe'
          if (-not (Test-Path $bin)) { throw "Firefox not found at $bin" }
          "FIREFOX_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: doctor
        run: fxcss doctor --theme fxcss/templates/starter

      - name: Optional stylesheets apply in install and try
        run: python -m tests.smoke_variants

      # Three, not two. The flakes this has caught were intermittent, so a
      # single pair passed often enough to be misleading.
      - name: Capture three times
        shell: bash
        run: |
          fxcss shot --theme fxcss/templates/starter --out shots/a --variants all
          fxcss shot --theme fxcss/templates/starter --out shots/b --variants all
          fxcss shot --theme fxcss/templates/starter --out shots/c --variants all

      - name: Determinism — the same theme must render identically
        shell: bash
        run: |
          set -e
          for pair in b c; do
            fxcss compare --base shots/a --head "shots/$pair" \
              --out "out/determinism-$pair" --platform ${{ matrix.label }}
          done
          python - <<'PY'
          import json, pathlib, sys
          failed = False
          for pair in ("b", "c"):
              s = json.loads(pathlib.Path(f"out/determinism-{pair}/summary.json").read_text())
              changed = s["changed_views"]
              if changed:
                  failed = True
                  print(f"run a vs run {pair}: rendered differently")
                  for v in changed:
                      print(f"    {v['view']}: {v['percent']}% of pixels")
              else:
                  print(f"run a vs run {pair}: all {len(s['views'])} views identical")
          sys.exit(1 if failed else 0)
          PY

      - name: Detects a real change
        shell: bash
        run: |
          cp -r fxcss/templates/starter "$RUNNER_TEMP/changed-theme"
          printf '\n#nav-bar { background-color: #ff2d55 !important; }\n' \
            >> "$RUNNER_TEMP/changed-theme/chrome/userChrome.css"
          fxcss shot --theme "$RUNNER_TEMP/changed-theme" --out shots/changed
          fxcss compare --base shots/a --head shots/changed --out out/changed \
            --platform ${{ matrix.label }}
          python - <<'PY'
          import json, sys, pathlib
          s = json.loads(pathlib.Path("out/changed/summary.json").read_text())
          if not s["any_change"]:
              print("An obvious CSS change produced no pixel difference — "
                    "the comparison is not sensitive.")
              sys.exit(1)
          print(f"{len(s['changed_views'])} of {len(s['views'])} views changed, as expected")
          PY

      # End to end and Linux-only (the code is platform-independent Python;
      # once is proof, three times is minutes): install the starter theme into
      # a fake profile, change the source, and let `upgrade --compare` render
      # installed vs new and diff them. This is the one upgrade path that
      # needs a live Firefox, so unit tests cannot carry it.
      - name: upgrade --compare renders installed vs new
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ffprofiles"
          mkdir -p "$root/Profiles/ci.default-release"
          touch "$root/Profiles/ci.default-release/prefs.js"
          printf '[Profile0]\nName=ci\nIsRelative=1\nPath=Profiles/ci.default-release\n' \
            > "$root/profiles.ini"
          cp -r fxcss/templates/starter "$RUNNER_TEMP/upgrade-src"
          FXCSS_PROFILE_ROOTS="$root" fxcss install "$RUNNER_TEMP/upgrade-src" \
            --profile ci --with '' --yes
          printf '\n#nav-bar { background-color: #a01414 !important; }\n' \
            >> "$RUNNER_TEMP/upgrade-src/chrome/userChrome.css"
          FXCSS_PROFILE_ROOTS="$root" fxcss upgrade --profile ci --compare --yes
          python - <<'PY'
          import glob, json, pathlib, sys
          dirs = sorted(glob.glob("/tmp/fxcss-upgrade-compare-*"))
          if not dirs:
              sys.exit("no fxcss-upgrade-compare output directory was written")
          summary = json.loads(
              pathlib.Path(dirs[-1], "diff", "summary.json").read_text())
          changed = [v["view"] for v in summary["changed_views"]]
          if not changed:
              sys.exit("the nav-bar recolour was not seen by upgrade --compare")
          print(f"upgrade --compare saw the change in: {', '.join(changed)}")
          PY

      - name: The sidebar, vertical-tab and toolbar views cover new ground
        shell: bash
        run: |
          # Each rule here is unreachable from the views that existed before
          # 0.12: nothing rendered a sidebar panel body, a vertical tab strip,
          # or a rearranged nav bar. If one of these views regresses into
          # capturing the plain window, this step is what notices.
          cp -r fxcss/templates/starter "$RUNNER_TEMP/state-theme"
          cat >> "$RUNNER_TEMP/state-theme/chrome/userChrome.css" <<'CSS'
          #sidebar-header { background-color: #ff2d55 !important; }
          #tabbrowser-tabs[orient="vertical"] { background-color: #34c759 !important; }
          #home-button { background-color: #ff9500 !important; }
          CSS
          fxcss shot --theme "$RUNNER_TEMP/state-theme" --out shots/state
          fxcss compare --base shots/a --head shots/state --out out/state \
            --platform ${{ matrix.label }}
          python - <<'PY'
          import json, pathlib, sys
          summary = json.loads(pathlib.Path("out/state/summary.json").read_text())
          changed = {v["view"] for v in summary["changed_views"]}
          wanted = {"extra-10-sidebar-bookmarks", "extra-11-sidebar-history",
                    "extra-14-vertical-tabs", "extra-15-toolbar"}
          missing = sorted(wanted - changed)
          if missing:
              print("These views did not react to a rule that only they can "
                    "render, so they are not capturing the state they claim: "
                    + ", ".join(missing))
              sys.exit(1)
          print(f"all four state views reacted; {len(changed)} views changed")
          PY

      - name: audit — the example theme must have no stale selectors
        run: fxcss audit --theme fxcss/templates/starter --strict --no-colour

      - name: catalogue
        run: fxcss catalogue --theme fxcss/templates/starter --out out/catalogue --self-contained

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fxcss-${{ matrix.label }}
          path: out/
          retention-days: 7
