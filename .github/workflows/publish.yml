name: Publish

# Publishes to PyPI when a version tag is pushed, so people can
# `pipx install fxcss` instead of cloning.
#
# Inactive until you opt in: set the repository variable PUBLISH_TO_PYPI to
# "true" (Settings → Secrets and variables → Actions → Variables). Until then
# this is a no-op rather than a job that fails on every tag.
#
# It uses PyPI Trusted Publishing, so there is no API token to store. Configure
# the publisher once at https://pypi.org/manage/account/publishing/ with:
#   owner AdamXweb · repo fxcss · workflow publish.yml · environment pypi

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
