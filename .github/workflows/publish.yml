name: Publish

# Publishes to PyPI when a version tag is pushed, so people can
# `pipx install fxcss` instead of cloning. The Release workflow tags a release
# when its "Prepare vX.Y.Z" pull request merges and starts this run on the tag.
#
# Both tag pushes and manual runs must pass the same unit and Firefox smoke
# tests as pull requests. A tag must also match the built package's version.
#
# Once PyPI serves the release, the follow-up job moves the README's pins to
# it, refreshes fxcss.com and creates the GitHub release if there isn't one.
#
# It uses PyPI Trusted Publishing, so there is no API token to store. Configure
# the publisher once at https://pypi.org/manage/account/publishing/ with:
#   owner AdamXweb · repo fxcss · workflow publish.yml · environment pypi

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.repository == 'AdamXweb/fxcss'
    uses: ./.github/workflows/ci.yml

  build:
    # Guards forks rather than gating opt-in: a fork pushing a tag should not
    # try to publish to the upstream project's name.
    if: github.repository == 'AdamXweb/fxcss'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Validate release version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          wheel_path, = Path("dist").glob("*.whl")
          with ZipFile(wheel_path) as wheel:
              metadata_path, = (name for name in wheel.namelist()
                                if name.endswith(".dist-info/METADATA"))
              version = BytesParser().parsebytes(wheel.read(metadata_path))["Version"]
          ref_type = os.environ["RELEASE_REF_TYPE"]
          ref_name = os.environ["RELEASE_REF_NAME"]
          if ref_type == "tag" and ref_name != f"v{version}":
              raise SystemExit(f"Release tag {ref_name!r} does not match "
                               f"package version {version!r}; expected v{version}")
          print(f"Validated fxcss {version} ({ref_type}: {ref_name})")
          PY
      - name: Record the version
        id: version
        run: echo "version=$(basename dist/*.whl | cut -d- -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  package-checks:
    needs: build
    uses: ./.github/workflows/package-check.yml
    with:
      artifact-name: dist

  publish:
    needs: [build, checks, package-checks]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

      # Upload succeeding is not the same as the release being installable:
      # the index lags the upload by seconds to minutes, and that gap is real
      # -- a pin bump pushed 13 seconds after a release left a CI runner
      # whose index still ended at the previous version, and its job red.
      # This gate polls with pip itself (the consumer that matters) until the
      # new version resolves, so a green Publish run MEANS "safe to bump
      # pins", and a rule to remember becomes a mechanism.
      - name: Gate — wait until the release is installable
        run: |
          set -euo pipefail
          # From the built artifact, not the tag: workflow_dispatch has no tag.
          version=$(basename dist/*.whl | cut -d- -f2)
          echo "waiting for fxcss==$version to resolve from PyPI …"
          for attempt in $(seq 1 40); do
            if python3 -m pip download --no-deps --no-cache-dir --quiet \
                --dest "$RUNNER_TEMP/gate" "fxcss==$version"; then
              echo "installable (attempt $attempt, ~$(( (attempt - 1) * 15 ))s after upload)"
              exit 0
            fi
            sleep 15
          done
          echo "::error::fxcss==$version still not installable 10 minutes after upload — do not bump pins off this run"
          exit 1

  # Runs only after the gate above, so nothing here advertises an install that
  # fails. A push made with GITHUB_TOKEN starts no workflow, so this starts the
  # website refresh itself rather than relying on Website docs. The later
  # steps still run if an earlier one fails; the job then fails to say so.
  follow-up:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the pin update and create the release
      actions: write    # start Refresh docs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Move the README pins
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release.py bump-pins "$VERSION" README.md
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Update the README pins to fxcss $VERSION" -- README.md
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              echo "::notice title=README pins::Moved to fxcss $VERSION ($(git rev-parse --short HEAD))."
              exit 0
            fi
            git pull -q --rebase origin main
          done
          echo "::error title=README pins::Could not push the pin update to main."
          exit 1
      - name: Refresh the website
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-docs.yml --repo "$GITHUB_REPOSITORY" --ref website
      - name: Create the GitHub release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION already has a release."
            exit 0
          fi
          # --target only applies when the tag doesn't exist yet: a manual run
          # from a branch then tags the commit it published.
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          echo "::notice title=GitHub release::Created v$VERSION. Edit its notes on the releases page."
