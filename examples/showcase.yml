name: Showcase screenshots

# Regenerates screenshots of the theme against real websites, in light and
# dark, and publishes them to a `showcase` branch so a README can link stable
# raw URLs.
#
# These are for looking at, not for testing. They are captured with `--url`,
# which writes to `live/` and is never part of a comparison: someone else's
# page can change its content, title or favicon between two runs, and a theme
# should not be blamed for that. The pass/fail check is `pr-preview.yml`.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated URLs to capture'
        required: false
        default: 'https://github.com/AdamXweb/WhiteSurFirefoxThemeMacOS'
  release:
    types: [published]

permissions:
  contents: write

env:
  FXCSS_VERSION: v0.6.0
  DEFAULT_URLS: >-
    https://github.com/AdamXweb/WhiteSurFirefoxThemeMacOS
    https://adam.kostarelas.com/?utm_source=fxcss-auto

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fxcss
        run: >-
          python -m pip install --disable-pip-version-check
          "fxcss[images] @ git+https://github.com/AdamXweb/fxcss@${{ env.FXCSS_VERSION }}"

      - name: Install Firefox
        run: |
          set -euo pipefail
          curl -sSL -o firefox.dmg \
            "https://download.mozilla.org/?product=firefox-latest-ssl&os=osx&lang=en-US"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/ffshow firefox.dmg
          cp -R /Volumes/ffshow/Firefox.app "$RUNNER_TEMP/Firefox.app"
          hdiutil detach /Volumes/ffshow -quiet
          echo "FIREFOX_BIN=$RUNNER_TEMP/Firefox.app/Contents/MacOS/firefox" >> "$GITHUB_ENV"

      - name: Capture
        run: |
          set -euo pipefail
          urls="${{ github.event.inputs.urls }}"
          [ -n "$urls" ] || urls="${DEFAULT_URLS}"
          args=""
          for u in $urls; do args="$args --url $u"; done
          # shellcheck disable=SC2086
          fxcss shot --out showcase --only-live $args

      - uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: showcase/live/
          retention-days: 90

      - name: Publish to the showcase branch
        run: |
          set -euo pipefail
          if [ -z "$(find showcase/live -name '*.png' -print -quit)" ]; then
            echo "nothing captured"; exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin showcase --depth=1 || true
          if git rev-parse --verify origin/showcase >/dev/null 2>&1; then
            git checkout -B showcase origin/showcase
          else
            git checkout --orphan showcase
            git rm -rf --cached . >/dev/null 2>&1 || true
            find . -maxdepth 1 -mindepth 1 ! -name .git ! -name showcase -exec rm -rf {} +
            printf '%s\n' '# Showcase screenshots' '' \
              'Generated by the Showcase workflow. Safe to delete; they are' \
              'regenerated on the next run.' > README.md
          fi
          mkdir -p screenshots
          cp showcase/live/*.png screenshots/
          git add -A screenshots README.md
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
          else
            git commit -m "showcase: refresh screenshots"
            git push origin showcase
            echo "Published. Reference them as:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            for f in screenshots/*.png; do
              echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/showcase/$f" \
                >> "$GITHUB_STEP_SUMMARY"
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
